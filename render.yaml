# Render Blueprint — the whole deployment in one file.
#
# IMPORTANT: this only takes effect via  Dashboard → New → Blueprint.
# Creating services through "New → Web Service" ignores this file entirely,
# which is why a manual setup needs everything typed in by hand.
#
# Two web services from one repo. They are separate processes sharing state
# through Redis, so this is a genuine multi-instance deployment — which is the
# point of the project — rather than a demo of one.
#
# Secrets live in ONE shared environment group, so Render prompts for them a
# single time and both services inherit them.

envVarGroups:
  - name: relay-shared
    envVars:
      # Render prompts for these once when you apply the Blueprint.
      # Use Neon's DIRECT endpoint, not the "-pooler" one: the pooled endpoint
      # benchmarked ~325ms slower per query, and a pooler in front of Prisma
      # (which already pools) is a second pool in series.
      - key: DATABASE_URL
        sync: false
      # Same value. Migrations need a direct connection regardless — they take
      # advisory locks and run DDL, neither of which survives a pooler.
      - key: DIRECT_URL
        sync: false
      # Atlas. Include the database name before the "?" or it silently uses "test".
      - key: MONGO_URL
        sync: false
      # Redis Cloud, TCP endpoint. Upstash's HTTP/REST API does not support
      # pub/sub, which the socket.io adapter depends on.
      - key: REDIS_URL
        sync: false

      # Generated by Render — nothing to type, and it never touches the repo.
      - key: JWT_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Free-tier CPU is slow; cost 12 can push login past a second.
      - key: BCRYPT_ROUNDS
        value: '10'

services:
  # ------------------------------------------------------------------ app 1
  - type: web
    name: relay-app-1
    runtime: node
    plan: free
    # Same region as all three databases. A send makes three sequential round
    # trips; across regions that is ~250ms of pure network per message.
    region: singapore
    branch: main
    healthCheckPath: /healthz

    # Four steps, all required:
    #   1. install
    #   2. generate the Prisma client (ships as a placeholder that throws)
    #   3. apply migrations  <- only this service does it
    #   4. build the React client -> client/dist, without which there is no UI
    buildCommand: npm install && npx prisma generate --schema server/prisma/schema.prisma && npx prisma migrate deploy --schema server/prisma/schema.prisma && npm run build --workspace client
    startCommand: npm run start

    envVars:
      # Pulls in every key from the shared group above. A group is referenced
      # from inside envVars with `fromGroup`, not as a sibling field.
      - fromGroup: relay-shared
      # Shown in the client's connection banner — what makes running on two
      # instances visible rather than merely claimed.
      - key: INSTANCE_ID
        value: app-1

  # ------------------------------------------------------------------ app 2
  - type: web
    name: relay-app-2
    runtime: node
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /healthz

    # No `migrate deploy` here: app-1 already applied the schema, and two
    # concurrent migrations can deadlock on Prisma's advisory lock.
    buildCommand: npm install && npx prisma generate --schema server/prisma/schema.prisma && npm run build --workspace client
    startCommand: npm run start

    envVars:
      - fromGroup: relay-shared
      - key: INSTANCE_ID
        value: app-2
